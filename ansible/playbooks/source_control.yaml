- name: Git source control workflow
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/vars.yml

  tasks:
    - name: Ensure local repository is cloned and up to date
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ default_branch }}"
        update: true

    - name: Configure git user name
      ansible.builtin.command:
        cmd: git config user.name "{{ git_user_name }}"
      args:
        chdir: "{{ repo_dest }}"

    - name: Configure git user email
      ansible.builtin.command:
        cmd: git config user.email "{{ git_user_email }}"
      args:
        chdir: "{{ repo_dest }}"

    - name: Check if remote branch already exists
      ansible.builtin.command:
        cmd: git ls-remote --heads {{ remote_name }} {{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      register: remote_branch_check
      changed_when: false

    - name: Create or switch to local branch tracking remote branch
      ansible.builtin.command:
        cmd: git checkout -B {{ branch_name }} {{ remote_name }}/{{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      when: remote_branch_check.stdout | length > 0

    - name: Create or switch to local branch
      ansible.builtin.command:
        cmd: git checkout -B {{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      when: remote_branch_check.stdout | length == 0

    - name: Pull latest code from branch
      ansible.builtin.command:
        cmd: git pull --ff-only {{ remote_name }} {{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      when: remote_branch_check.stdout | length > 0

    - name: Add files to staging area
      ansible.builtin.command:
        cmd: git add {{ files_to_stage }}
      args:
        chdir: "{{ repo_dest }}"

    - name: Check whether staged changes exist
      ansible.builtin.command:
        cmd: git diff --cached --quiet
      args:
        chdir: "{{ repo_dest }}"
      register: staged_changes
      failed_when: staged_changes.rc not in [0, 1]
      changed_when: staged_changes.rc == 1

    - name: Commit staged changes
      ansible.builtin.command:
        cmd: git commit -m "{{ commit_message }}"
      args:
        chdir: "{{ repo_dest }}"
      when: staged_changes.rc == 1

    - name: Push branch to remote
      ansible.builtin.command:
        cmd: git push --set-upstream {{ remote_name }} {{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"

