- name: Git source control workflow
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/vars.yml

  tasks:
    - name: Ensure local repository is cloned and up to date
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ default_branch }}"
        update: true
      tags:
        - clone

    - name: Read effective git configuration in repository
      ansible.builtin.command:
        cmd: git config --list
      args:
        chdir: "{{ repo_dest }}"
      register: git_config_list
      changed_when: false
      tags:
        - configuration

    - name: Read branch information in repository
      ansible.builtin.command:
        cmd: git branch --all --verbose
      args:
        chdir: "{{ repo_dest }}"
      register: git_branch_list
      changed_when: false
      tags:
        - configuration

    - name: Read remote information in repository
      ansible.builtin.command:
        cmd: git remote -v
      args:
        chdir: "{{ repo_dest }}"
      register: git_remote_list
      changed_when: false
      tags:
        - configuration

    - name: Show git repository configuration summary
      ansible.builtin.debug:
        msg:
          - "git config --list: {{ git_config_list.stdout_lines }}"
          - "git branch --all --verbose: {{ git_branch_list.stdout_lines }}"
          - "git remote -v: {{ git_remote_list.stdout_lines }}"
      tags:
        - configuration

    - name: Check if remote branch already exists
      ansible.builtin.command:
        cmd: git ls-remote --heads {{ remote_name }} {{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      register: remote_branch_check
      changed_when: false
      tags:
        - make_branch
        - switch_pull
        - switch_stage

    - name: Create or switch to local branch tracking remote branch
      ansible.builtin.command:
        cmd: git checkout -B {{ branch_name }} {{ remote_name }}/{{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      when: remote_branch_check.stdout | length > 0
      tags:
        - make_branch
        - switch_pull
        - switch_stage

    - name: Create or switch to local branch
      ansible.builtin.command:
        cmd: git checkout -B {{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      when: remote_branch_check.stdout | length == 0
      tags:
        - make_branch
        - switch_pull
        - switch_stage

    - name: Pull latest code from branch
      ansible.builtin.command:
        cmd: git pull --ff-only {{ remote_name }} {{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      when: remote_branch_check.stdout | length > 0
      tags:
        - switch_pull

    - name: Add files to staging area
      ansible.builtin.command:
        cmd: git add {{ files_to_stage }}
      args:
        chdir: "{{ repo_dest }}"
      tags:
        - switch_stage

    - name: Check whether staged changes exist
      ansible.builtin.command:
        cmd: git diff --cached --quiet
      args:
        chdir: "{{ repo_dest }}"
      register: staged_changes
      failed_when: staged_changes.rc not in [0, 1]
      changed_when: staged_changes.rc == 1
      tags:
        - commit

    - name: Prompt for commit message when not provided
      ansible.builtin.pause:
        prompt: "Enter commit message"
      register: commit_message_prompt
      when:
        - staged_changes.rc == 1
        - commit_message | default('') | trim | length == 0
      tags:
        - commit

    - name: Build effective commit message
      ansible.builtin.set_fact:
        commit_message_effective: >-
          {{ (commit_message | default('') | trim)
             if (commit_message | default('') | trim | length > 0)
             else (commit_message_prompt.user_input | trim) }}
      when: staged_changes.rc == 1
      tags:
        - commit

    - name: Validate effective commit message is not empty
      ansible.builtin.assert:
        that:
          - commit_message_effective | length > 0
        fail_msg: Commit message cannot be empty.
      when: staged_changes.rc == 1
      tags:
        - commit

    - name: Commit staged changes
      ansible.builtin.command:
        cmd: git commit -m "{{ commit_message_effective }}"
      args:
        chdir: "{{ repo_dest }}"
      when: staged_changes.rc == 1
      tags:
        - commit

    - name: Push branch to remote
      ansible.builtin.command:
        cmd: git push --set-upstream {{ remote_name }} {{ branch_name }}
      args:
        chdir: "{{ repo_dest }}"
      tags:
        - push

