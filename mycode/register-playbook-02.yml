---
- name: Demonstrate register and digging into stdout_lines
  hosts: bender 
  tasks:
    - name: Install sl
      apt:
        name: sl
        state: present 
        update_cache: yes
      register: apt_result
      become: true

    - name: Display full output
      debug:
        var: apt_result

    - name: Display specific parts of the output
      debug:
        msg: "The task changed: {{ apt_result.changed }}"

    - name: Display a particular line in the output 
      debug:
        msg: "A particuare line: {{ apt_result.stdout_lines[3] }}"
